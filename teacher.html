<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="dashboard">
        <h1>Cloud Attendance System</h1>
        <h2>Teacher Dashboard</h2>
        <p id="welcome">Welcome Teacher</p>

        <label for="subject"><strong>Select Subject</strong></label>
        <select id="subject">
            <option value="">Select Subject</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
        </select>

        <label for="student"><strong>Select Student</strong></label>
        <select id="student">
            <option value="">Loading students...</option>
        </select>

        <p id="statusHint" class="hint"></p>

        <div class="buttons">
            <button id="presentBtn">Present</button>
            <button id="absentBtn">Absent</button>
            <button id="saveAttendance">Save Attendance</button>
            <button id="viewAttendance">View Attendance</button>
            <button id="logoutBtn" class="secondary">Logout</button>
        </div>
    </div>

    <script type="module" src="../js/teacher.js"></script>
</body>

</html>
