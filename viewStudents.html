<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-role="student">
    <div class="dashboard wide">
        <h1>Students</h1>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Class</th>
                        <th>Roll No</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>

        <div class="buttons">
            <button id="backBtn" class="secondary">Back</button>
        </div>
    </div>

    <script type="module" src="js/viewUsers.js"></script>
</body>

</html>
