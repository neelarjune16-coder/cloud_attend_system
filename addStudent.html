<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="dashboard">
        <h1>Cloud Attendance System</h1>
        <h2>Add Student</h2>

        <input type="text" id="studentName" placeholder="Student Name">
        <input type="email" id="studentEmail" placeholder="Student Email">
        <input type="password" id="studentPassword" placeholder="Login Password (min 6 characters)">
        <input type="text" id="studentDept" placeholder="Class / Department">
        <input type="text" id="studentRoll" placeholder="Roll Number">
        <input type="text" id="studentID" placeholder="Student ID">

        <div class="buttons">
            <button id="saveStudent">Save Student</button>
            <button id="backBtn" class="secondary">Back</button>
        </div>

        <p id="message"></p>
    </div>

    <script type="module" src="../js/addStudent.js"></script>
</body>

</html>
