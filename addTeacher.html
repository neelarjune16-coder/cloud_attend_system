<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="dashboard">
        <h1>Cloud Attendance System</h1>
        <h2>Add Teacher</h2>

        <input type="text" id="teacherName" placeholder="Teacher Name">
        <input type="email" id="teacherEmail" placeholder="Teacher Email">
        <input type="password" id="teacherPassword" placeholder="Login Password (min 6 characters)">
        <input type="text" id="teacherDept" placeholder="Department">
        <input type="text" id="teacherID" placeholder="Employee ID">

        <div class="buttons">
            <button id="saveTeacher">Save Teacher</button>
            <button id="backBtn" class="secondary">Back</button>
        </div>

        <p id="message"></p>
    </div>

    <script type="module" src="../js/addTeacher.js"></script>
</body>

</html>
